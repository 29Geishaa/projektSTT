<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Transkrypcji STT</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }
        .app-container {
            background-color: #262626;
            width: 100%;
            max-width: 1100px;
            height: 90vh;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #333;
            position: relative;
        }
        .user-bar {
            background-color: #202020;
            padding: 10px 30px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #aaa;
        }
        .user-bar-right {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .user-bar a {
            color: #007bff;
            text-decoration: none;
            transition: color 0.2s;
        }
        .user-bar a:hover {
            color: #0056b3;
        }
        .user-bar a.logout-link {
            color: #dc3545;
        }
        .user-bar a.logout-link:hover {
            color: #bd2130;
        }
        .history-trigger {
            background: none;
            border: none;
            color: #ffc107;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
            transition: transform 0.2s, color 0.2s;
        }
        .history-trigger:hover {
            color: #e0a800;
            transform: scale(1.05);
        }
        .header {
            padding: 20px 30px;
            border-bottom: 1px solid #333;
            background-color: #2d2d2d;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
            color: #ffffff;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 30px;
            gap: 20px;
            overflow-y: auto;
        }
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            background-color: #2d2d2d;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid #383838;
        }
        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        label {
            font-size: 14px;
            color: #aaa;
        }
        select, input[type="file"] {
            background-color: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        select:focus {
            border-color: #007bff;
        }
        .btn {
            padding: 9px 18px;
            font-size: 14px;
            font-weight: 500;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .btn-warning {
            background-color: #ffc107;
            color: #111;
        }
        .btn-warning:hover {
            background-color: #e0a800;
        }
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background-color: #bd2130;
        }
        .btn-secondary {
            background-color: #444;
            color: #e0e0e0;
        }
        .btn-secondary:hover {
            background-color: #555;
        }
        .btn:disabled {
            background-color: #333;
            color: #777;
            cursor: not-allowed;
        }
        .visualizer-container {
            height: 60px;
            background-color: #1a1a1a;
            border-radius: 8px;
            border: 1px solid #333;
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #aaa;
        }
        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid #555;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .results-wrapper {
            flex: 1;
            display: flex;
            gap: 20px;
            min-height: 250px;
        }
        .result-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .result-box-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .result-box h3 {
            font-size: 14px;
            color: #aaa;
            font-weight: 500;
        }
        .export-btn-group {
            display: flex;
            gap: 5px;
        }
        .btn-xs {
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 4px;
        }
        textarea {
            flex: 1;
            background-color: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            font-size: 15px;
            line-height: 1.6;
            resize: none;
            outline: none;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #444;
        }
        textarea.ai-notes-area {
            border-color: #2b4c7e;
            background-color: #16222f;
        }
        .divider {
            border-left: 1px solid #444;
            height: 25px;
            margin: 0 5px;
        }
        .history-sidebar {
            position: absolute;
            top: 0;
            right: -360px;
            width: 360px;
            height: 100%;
            background-color: #202020;
            border-left: 1px solid #333;
            box-shadow: -4px 0 15px rgba(0,0,0,0.5);
            transition: right 0.3s ease-in-out;
            z-index: 999;
            display: flex;
            flex-direction: column;
        }
        .history-sidebar.open {
            right: 0;
        }
        .history-header {
            padding: 20px;
            background-color: #2d2d2d;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-header h2 {
            font-size: 16px;
            color: #fff;
        }
        .close-history-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 20px;
            cursor: pointer;
        }
        .close-history-btn:hover {
            color: #fff;
        }
        .history-list-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .history-item {
            background-color: #2d2d2d;
            border: 1px solid #383838;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s;
        }
        .history-item:hover {
            background-color: #333;
        }
        .history-item-info {
            flex: 1;
            cursor: pointer;
            overflow: hidden;
            margin-right: 10px;
        }
        .history-item-title {
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .history-item-date {
            font-size: 11px;
            color: #777;
        }
        .delete-item-btn {
            background: none;
            border: none;
            color: #dc3545;
            cursor: pointer;
            font-size: 14px;
            padding: 5px;
            border-radius: 4px;
            transition: background-color 0.2s;
        }
        .delete-item-btn:hover {
            background-color: rgba(220, 53, 69, 0.2);
        }

        /* DODATEK CSS DLA NOWOCZESNEGO SWITCHA ONLINE/OFFLINE */
        .switch-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        .switch-input {
            display: none;
        }
        .switch-slider {
            width: 40px;
            height: 20px;
            background-color: #444;
            border-radius: 20px;
            position: relative;
            transition: background-color 0.2s;
            border: 1px solid #555;
        }
        .switch-slider::before {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: #fff;
            top: 2px;
            left: 2px;
            transition: transform 0.2s;
        }
        .switch-input:checked + .switch-slider {
            background-color: #007bff;
            border-color: #0056b3;
        }
        .switch-input:checked + .switch-slider::before {
            transform: translateX(20px);
        }
        .online-label {
            font-size: 14px;
            font-weight: 500;
            color: #777;
            transition: color 0.2s;
        }
        .switch-input:checked ~ .online-label {
            color: #007bff;
        }
        .badge-cloud {
            background-color: #28a745;
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #1e7e34;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="user-bar">
            <div>Zalogowany jako: <strong>{{ user.first_name }} {{ user.last_name }}</strong> ({{ user.email }})</div>
            <div class="user-bar-right">
                <button id="openHistoryBtn" class="history-trigger">🕒 Historia</button>
                <div class="divider" style="height: 15px;"></div>
                <a href="{{ url_for('change_password') }}">Zmiana hasła</a>
                <a href="{{ url_for('logout') }}" class="logout-link">Wyloguj się</a>
            </div>
        </div>

        <div class="header">
            <h1>Zaawansowany Panel Transkrypcji Speech-to-Text</h1>
        </div>
        
        <div class="main-content">
            <div class="toolbar">
                <div class="tool-group">
                    <label class="switch-container">
                        <span style="font-size: 14px; color: #aaa;">Lokalnie</span>
                        <input type="checkbox" id="modeSwitch" class="switch-input">
                        <div class="switch-slider"></div>
                        <span class="online-label">Chmura Groq</span>
                    </label>
                </div>

                <div class="divider"></div>

                <div class="tool-group" id="modelSelectGroup">
                    <label for="modelSelect">Model:</label>
                    <select id="modelSelect">
                        <option value="tiny">Tiny (Szybki)</option>
                        <option value="base" selected>Base (Zrównoważony)</option>
                        <option value="small">Small (Dokładny)</option>
                    </select>
                </div>

                <div class="tool-group" id="cloudBadgeGroup" style="display: none;">
                    <div class="badge-cloud"> Silnik: Groq Cloud (Whisper V3)</div>
                </div>
                
                <div class="divider"></div>

                <div class="tool-group">
                    <label for="languageSelect">Język:</label>
                    <select id="languageSelect">
                        <option value="auto" selected>Auto-detekcja</option>
                        <option value="pl">Polski</option>
                        <option value="en">Angielski</option>
                        <option value="de">Niemiecki</option>
                        <option value="es">Hiszpański</option>
                    </select>
                </div>

                <div class="divider"></div>

                <div class="tool-group">
                    <label for="taskSelect">Zadanie:</label>
                    <select id="taskSelect">
                        <option value="transcribe" selected>Transkrypcja</option>
                        <option value="translate">Tłumaczenie (-> EN)</option>
                    </select>
                </div>
            </div>

            <div class="toolbar">
                <div class="tool-group">
                    <button id="startBtn" class="btn btn-primary">Nagraj</button>
                    <button id="pauseBtn" class="btn btn-warning" disabled>Pauza</button>
                    <button id="stopBtn" class="btn btn-danger" disabled>Stop</button>
                </div>

                <div class="divider"></div>

                <div class="tool-group">
                    <input type="file" id="fileInput" accept="audio/*">
                    <button id="uploadBtn" class="btn btn-secondary">Prześlij plik</button>
                </div>

                <div style="margin-left: auto;" class="status-container">
                    <div id="spinner" class="spinner"></div>
                    <span id="status">Gotowy</span>
                </div>
            </div>

            <div class="visualizer-container">
                <canvas id="visualizer"></canvas>
            </div>

            <div class="results-wrapper">
                <div class="result-box">
                    <div class="result-box-header">
                        <h3>✨ Podsumowanie i Notatki AI (Llama 3)</h3>
                        <div class="export-btn-group">
                            <button onclick="exportData('txt', 'aiNotes')" class="btn btn-secondary btn-xs">TXT</button>
                            <button onclick="exportData('docx', 'aiNotes')" class="btn btn-secondary btn-xs">Word</button>
                            <button onclick="exportData('pdf', 'aiNotes')" class="btn btn-secondary btn-xs">PDF</button>
                        </div>
                    </div>
                    <textarea id="aiNotes" class="ai-notes-area" readonly placeholder="Tutaj pojawi się ustrukturyzowana notatka z nagrania stworzona przez AI..."></textarea>
                </div>
                
                <div class="result-box">
                    <div class="result-box-header">
                        <h3>📝 Pełna Transkrypcja (Surowy tekst)</h3>
                        <div class="export-btn-group">
                            <button onclick="exportData('txt', 'result')" class="btn btn-secondary btn-xs">TXT</button>
                            <button onclick="exportData('docx', 'result')" class="btn btn-secondary btn-xs">Word</button>
                            <button onclick="exportData('pdf', 'result')" class="btn btn-secondary btn-xs">PDF</button>
                        </div>
                    </div>
                    <textarea id="result" readonly placeholder="Tutaj pojawi się pełny, surowy tekst z nagrania..."></textarea>
                </div>
            </div>
        </div>

        <div id="historySidebar" class="history-sidebar">
            <div class="history-header">
                <h2>🕒 Twoja Historia</h2>
                <button id="closeHistoryBtn" class="close-history-btn">&times;</button>
            </div>
            <div id="historyList" class="history-list-container"></div>
        </div>
    </div>

    <form id="exportForm" action="" method="POST" style="display: none;">
        <input type="hidden" name="content" id="exportContent">
        <input type="hidden" name="title" id="exportTitle">
    </form>

    <script>
        let mediaRecorder;
        let audioChunks = [];
        let audioCtx;
        let analyser;
        let animationId;
        
        let countdownInterval;
        let recordStartTime;
        let totalRecordingTime = 0;
        let currentDocumentName = "Transkrypcja"; 

        const startBtn = document.getElementById('startBtn');
        const pauseBtn = document.getElementById('pauseBtn');
        const stopBtn = document.getElementById('stopBtn');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const spinner = document.getElementById('spinner');
        const resultTextarea = document.getElementById('result');
        const aiNotesTextarea = document.getElementById('aiNotes');
        const modelSelect = document.getElementById('modelSelect');
        const languageSelect = document.getElementById('languageSelect');
        const taskSelect = document.getElementById('taskSelect');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');

        const historySidebar = document.getElementById('historySidebar');
        const openHistoryBtn = document.getElementById('openHistoryBtn');
        const closeHistoryBtn = document.getElementById('closeHistoryBtn');
        const historyList = document.getElementById('historyList');
        
        // Elementy sterujące widokiem trybu Online
        const modeSwitch = document.getElementById('modeSwitch');
        const modelSelectGroup = document.getElementById('modelSelectGroup');
        const cloudBadgeGroup = document.getElementById('cloudBadgeGroup');

        let cachedHistory = [];

        // Obsługa dynamicznego ukrywania modeli przy przełączaniu trybu
        modeSwitch.addEventListener('change', function() {
            if(this.checked) {
                modelSelectGroup.style.display = 'none';
                cloudBadgeGroup.style.display = 'flex';
            } else {
                modelSelectGroup.style.display = 'flex';
                cloudBadgeGroup.style.display = 'none';
            }
        });

        function setStatus(text, isLoading = false) {
            status.textContent = text;
            spinner.style.display = isLoading ? 'block' : 'none';
        }

        function startSmartCountdown(audioDurationSeconds) {
            clearInterval(countdownInterval);
            
            // Jeśli wybrano tryb Chmury Groq, nie odpalamy długiego licznika lokalnego
            if (modeSwitch.checked) {
                setStatus("Wysyłanie do chmury Groq... Błyskawiczna analiza", true);
                return;
            }

            const speedMultipliers = { "tiny": 0.05, "base": 0.15, "small": 0.3 };
            const multiplier = speedMultipliers[modelSelect.value] || 0.15;
            
            let timeLeft = Math.round((audioDurationSeconds * multiplier) + 2);
            if (timeLeft < 3) timeLeft = 3;

            setStatus(`Analiza audio... Pozostało ok. ${timeLeft}s`, true);

            countdownInterval = setInterval(() => {
                timeLeft--;
                if (timeLeft > 0) {
                    setStatus(`Analiza audio... Pozostało ok. ${timeLeft}s`, true);
                } else {
                    setStatus("Kończenie generowania notatek przez AI...", true);
                    clearInterval(countdownInterval);
                }
            }, 1000);
        }

        function stopCountdown() {
            clearInterval(countdownInterval);
        }

        openHistoryBtn.addEventListener('click', async () => {
            historySidebar.classList.add('open');
            await loadHistoryFromServer();
        });

        closeHistoryBtn.addEventListener('click', () => {
            historySidebar.classList.remove('open');
        });

        async function loadHistoryFromServer() {
            historyList.innerHTML = "<p style='color: #777; font-size: 13px;'>Ładowanie historii...</p>";
            try {
                const response = await fetch('/get-history');
                const data = await response.json();
                
                if (response.ok) {
                    cachedHistory = data;
                    historyList.innerHTML = "";
                    
                    if (data.length === 0) {
                        historyList.innerHTML = "<p style='color: #777; font-size: 13px;'>Brak zapisanych transkrypcji.</p>";
                        return;
                    }
                    
                    data.forEach((item, index) => {
                        const itemDiv = document.createElement('div');
                        itemDiv.className = "history-item";
                        itemDiv.innerHTML = `
                            <div class="history-item-info" onclick="displayHistoryItem(${index})">
                                <div class="history-item-title">${item.filename}</div>
                                <div class="history-item-date">${item.created_at}</div>
                            </div>
                            <button class="delete-item-btn" onclick="deleteHistoryItem(${item.id}, event)">🗑️</button>
                        `;
                        historyList.appendChild(itemDiv);
                    });
                } else {
                    historyList.innerHTML = "<p style='color: red; font-size: 13px;'>Błąd pobierania danych.</p>";
                }
            } catch (err) {
                historyList.innerHTML = "<p style='color: red; font-size: 13px;'>Błąd połączenia z bazą.</p>";
            }
        }

        async function deleteHistoryItem(id, event) {
            event.stopPropagation(); 
            if (!confirm("Czy na pewno chcesz trwale usunąć to nagranie z historii?")) return;

            try {
                const response = await fetch(`/delete-history/${id}`, { method: 'DELETE' });
                if (response.ok) {
                    await loadHistoryFromServer(); 
                    setStatus("Usunięto nagranie z bazy", false);
                } else {
                    alert("Błąd podczas usuwania elementu.");
                }
            } catch (err) {
                alert("Błąd połączenia z serwerem.");
            }
        }

        function displayHistoryItem(index) {
            const item = cachedHistory[index];
            if (item) {
                currentDocumentName = item.filename; 
                resultTextarea.value = item.raw_text;
                aiNotesTextarea.value = item.ai_notes;
                historySidebar.classList.remove('open');
                setStatus(`Wczytano: ${item.filename}`, false);
            }
        }

        function exportData(format, textareaId) {
            const textarea = document.getElementById(textareaId);
            const content = textarea.value.trim();
            
            if (!content) {
                alert("Brak zawartości do wyeksportowania!");
                return;
            }

            const prefix = textareaId === "aiNotes" ? "Notatka AI" : "Transkrypcja surowa";
            const fullTitle = `${prefix} - ${currentDocumentName}`;

            if (format === 'txt') {
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${fullTitle}.txt`;
                link.click();
            } else {
                const form = document.getElementById('exportForm');
                const contentInput = document.getElementById('exportContent');
                const titleInput = document.getElementById('exportTitle');
                
                form.action = `/export/${format}`;
                contentInput.value = content;
                titleInput.value = fullTitle;
                form.submit();
            }
        }

        function resizeCanvas() {
            canvas.width = canvas.parentNode.clientWidth;
            canvas.height = canvas.parentNode.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawVisualizer() {
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            const draw = () => {
                animationId = requestAnimationFrame(draw);
                
                if (mediaRecorder && mediaRecorder.state === "paused") {
                    canvasCtx.fillStyle = '#1a1a1a';
                    canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
                    return;
                }

                analyser.getByteFrequencyData(dataArray);

                canvasCtx.fillStyle = '#1a1a1a';
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                const barWidth = (canvas.width / bufferLength) * 2.5;
                let barHeight;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    barHeight = dataArray[i] / 2;
                    canvasCtx.fillStyle = `rgb(${barHeight + 50}, 123, 255)`;
                    canvasCtx.fillRect(x, canvas.height - barHeight, barWidth - 1, barHeight);
                    x += barWidth;
                }
            };
            draw();
        }

        startBtn.addEventListener('click', async () => {
            audioChunks = [];
            totalRecordingTime = 0;
            recordStartTime = Date.now();
            
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                const source = audioCtx.createMediaStreamSource(stream);
                source.connect(analyser);
                analyser.fftSize = 64;
                
                drawVisualizer();

                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const customName = prompt("Jak chcesz nazwać to nagranie w historii?", "Moje nagranie audio");
                    if(customName) currentDocumentName = customName;
                    
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await sendAudio(audioBlob, 'recording.wav', customName);
                };

                mediaRecorder.start();
                startBtn.disabled = true;
                pauseBtn.disabled = false;
                pauseBtn.textContent = "Pauza";
                stopBtn.disabled = false;
                setStatus("Nagrywanie dźwięku...", false);
            } catch (err) {
                alert("Brak dostępu do mikrofonu lub błąd urządzenia.");
            }
        });

        pauseBtn.addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === "recording") {
                mediaRecorder.pause();
                totalRecordingTime += (Date.now() - recordStartTime) / 1000;
                pauseBtn.textContent = "Wznów";
                setStatus("Nagrywanie wstrzymane (Pauza)", false);
            } else if (mediaRecorder && mediaRecorder.state === "paused") {
                mediaRecorder.resume();
                recordStartTime = Date.now();
                pauseBtn.textContent = "Pauza";
                setStatus("Nagrywanie dźwięku...", false);
            }
        });

        stopBtn.addEventListener('click', () => {
            if (mediaRecorder.state !== "paused") {
                totalRecordingTime += (Date.now() - recordStartTime) / 1000;
            }
            
            mediaRecorder.stop();
            mediaRecorder.stream.getTracks().forEach(track => track.stop());
            
            if (audioCtx) {
                audioCtx.close();
            }
            cancelAnimationFrame(animationId);
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

            startBtn.disabled = false;
            pauseBtn.disabled = true;
            pauseBtn.textContent = "Pauza";
            stopBtn.disabled = true;
            
            startSmartCountdown(totalRecordingTime);
        });

        uploadBtn.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) {
                alert('Wybierz plik audio przed wysłaniem!');
                return;
            }
            
            const customName = prompt("Podaj przyjazną nazwę dla tego pliku w historii:", file.name);
            if(customName) currentDocumentName = customName;
            
            const audioObj = document.createElement('audio');
            audioObj.src = URL.createObjectURL(file);
            audioObj.addEventListener('loadedmetadata', () => {
                startSmartCountdown(audioObj.duration);
                sendAudio(file, file.name, customName);
            });
        });

        async function sendAudio(blob, filename, customName = "") {
            const formData = new FormData();
            formData.append('file', blob, filename);
            formData.append('model_name', modelSelect.value);
            formData.append('language', languageSelect.value);
            formData.append('task', taskSelect.value);
            formData.append('custom_name', customName);
            
            // Wysyłamy stan switcha (online / offline)
            formData.append('processing_mode', modeSwitch.checked ? 'online' : 'offline');

            resultTextarea.value = "";
            aiNotesTextarea.value = "";
            
            try {
                const response = await fetch('/transcribe', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.text) {
                    resultTextarea.value = data.text.trim();
                    aiNotesTextarea.value = data.notes ? data.notes.trim() : "Model AI nie zwrócił analizy.";
                    if (data.model_used) {
                        setStatus(`Ukończono silnikiem: ${data.model_used}`, false);
                    }
                } else {
                    resultTextarea.value = "Błąd serwera: " + (data.error || JSON.stringify(data));
                }
            } catch (error) {
                resultTextarea.value = "BŁĄD POŁĄCZENIA Z SERWEREM!";
            } finally {
                stopCountdown();
                if (status.textContent.indexOf("Ukończono") === -1) {
                    setStatus("Gotowy", false);
                }
            }
        }
    </script>
</body>
</html>
