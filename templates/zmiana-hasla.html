<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System STT - Zmiana Hasła</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-gradient-start: #f8fafc;
            --bg-gradient-end: #e2e8f0;
        }

        body {
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .password-container {
            width: 100%;
            max-width: 440px;
        }

        .password-card {
            background: #ffffff;
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
        }

        .brand-icon {
            width: 60px;
            height: 60px;
            background: rgba(239, 68, 68, 0.1); /* Delikatna czerwona poświata dla operacji bezpieczeństwa */
            color: #ef4444;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin: 0 auto 20px auto;
        }

        .password-title {
            color: #1e293b;
            font-weight: 700;
            font-size: 24px;
            text-align: center;
            margin-bottom: 8px;
        }

        .password-subtitle {
            color: #64748b;
            font-size: 14px;
            text-align: center;
            margin-bottom: 32px;
        }

        .form-label {
            color: #334155;
            font-weight: 500;
            font-size: 14px;
            margin-bottom: 6px;
        }

        .form-control {
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 14px;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.15);
        }

        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            border-radius: 8px;
            padding: 11px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .back-link {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
        }

        .back-link a {
            color: #64748b;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .back-link a:hover {
            color: #1e293b;
        }

        .alert {
            border-radius: 8px;
            font-size: 14px;
            padding: 12px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="password-container">
    <div class="password-card">
        
        <div class="brand-icon">
            <i class="bi bi-shield-lock-fill"></i>
        </div>

        <h1 class="password-title">Zmień hasło</h1>
        <p class="password-subtitle">Wprowadź aktualne oraz nowe dane dostępowe</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'danger' else 'success' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form action="{{ url_for('change_password') }}" method="POST">
            
            <div class="mb-3">
                <label for="current_password" class="form-label">Aktualne hasło</label>
                <input type="password" class="form-control" id="current_password" name="current_password" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <hr class="my-4 text-muted" style="opacity: 0.15;">
            
            <div class="mb-3">
                <label for="new_password" class="form-label">Nowe hasło</label>
                <input type="password" class="form-control" id="new_password" name="new_password" placeholder="••••••••" required autocomplete="new-password">
            </div>
            
            <div class="mb-4">
                <label for="confirm_new_password" class="form-label">Powtórz nowe hasło</label>
                <input type="password" class="form-control" id="confirm_new_password" name="confirm_new_password" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit" class="btn btn-primary w-100">Zapisz nowe hasło</button>
        </form>

        <div class="back-link">
            <a href="{{ url_for('test_page') }}">
                <i class="bi bi-arrow-left"></i> Wróć do panelu głównego
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
