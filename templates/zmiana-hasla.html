<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Zmiana Hasła</title>
</head>
<body>
    <h2>Zmień swoje hasło</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p style="color: red;"><strong>{{ message }}</strong></p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('change_password') }}">
        <label>Aktualne hasło:</label><br>
        <input type="password" name="current_password" required><br><br>
        
        <label>Nowe hasło:</label><br>
        <input type="password" name="new_password" required><br><br>
        
        <label>Powtórz nowe hasło:</label><br>
        <input type="password" name="confirm_new_password" required><br><br>
        
        <button type="submit">Zapisz nowe hasło</button>
    </form>

    <p><a href="{{ url_for('test_page') }}">Powrót do panelu</a></p>
</body>
</html>
